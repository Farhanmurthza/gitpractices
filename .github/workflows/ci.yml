name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Say Hello
        run: echo "Hello from CI!"

      - name: List files
        run: ls -la

      - name: Run a test
        run: |
          echo "Running tests..."
          if [ -f README.md ]; then
            echo "README.md exists!"
            exit 0
          else
            echo "README.md missing!"
            exit 1
          fi
